name = "datapopcorn-datahub-mcp"
main = "worker.js"
compatibility_date = "2026-11-01"
account_id = "6647a1f7aa58954faaffdf4e042f305a"
workers_dev = false
compatibility_flags = ["global_fetch_strictly_public"]


rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

routes = [
  { pattern = "api.datapopcorn.ai", custom_domain = true }
]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "568d9802093e44b498cd7e06c30c8816"

[[d1_databases]]
binding = "USAGE_DB"
database_name = "datapopcorn-mcp-usage"
database_id = "d5935553-709b-40c2-b2d2-0a93ae51917d"
migrations_dir = "migrations"

[triggers]
crons = ["0 18 * * *"]
